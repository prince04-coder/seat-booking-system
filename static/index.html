<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketing Engine — High-Concurrency Seat Booking</title>
    <meta name="description" content="Intelligent high-concurrency ticketing engine with real-time seat booking powered by C++, MySQL, and Crow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #12121f;
            --bg-card: #181830;
            --bg-glass: rgba(24, 24, 48, 0.7);
            --accent: #00d4ff;
            --accent-purple: #7c4dff;
            --accent-glow: rgba(0, 212, 255, 0.25);
            --green: #00e676;
            --green-dark: #1b5e20;
            --green-mid: #2e7d32;
            --green-glow: rgba(0, 230, 118, 0.2);
            --red: #ff1744;
            --red-dark: #b71c1c;
            --red-mid: #c62828;
            --red-glow: rgba(255, 23, 68, 0.2);
            --orange: #ff9100;
            --orange-dark: #e65100;
            --text: #e8eaf6;
            --text-muted: #7986cb;
            --border: #2a2a4a;
            --font: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(124, 77, 255, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 212, 255, 0.06) 0%, transparent 50%);
        }

        /* ── Header ── */
        header {
            width: 100%;
            padding: 2rem 2rem 1.5rem;
            text-align: center;
            background: linear-gradient(180deg, var(--bg-secondary), transparent);
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent-purple), transparent);
        }

        header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.4rem;
            letter-spacing: -0.02em;
        }

        header .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 400;
        }

        .stats-bar {
            display: flex;
            gap: 2.5rem;
            justify-content: center;
            margin-top: 1.2rem;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .stat strong {
            color: var(--text);
            font-size: 1rem;
            font-weight: 600;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.green { background: var(--green); box-shadow: 0 0 10px var(--green-glow); }
        .dot.red { background: var(--red); box-shadow: 0 0 10px var(--red-glow); }

        /* ── Main ── */
        main {
            flex: 1;
            padding: 2rem 1.5rem;
            max-width: 780px;
            width: 100%;
        }

        /* ── Stage indicator ── */
        .stage {
            text-align: center;
            padding: 0.7rem 2rem;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, transparent 5%, var(--bg-card) 30%, var(--bg-card) 70%, transparent 95%);
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 0.7rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 600;
            border: 1px solid var(--border);
            border-left: none;
            border-right: none;
        }

        /* ── User input ── */
        .user-input {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.8rem;
        }

        .user-input label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .user-input input {
            padding: 0.55rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text);
            font-family: var(--font);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 200px;
        }

        .user-input input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* ── Seat Grid ── */
        .seat-grid {
            display: grid;
            grid-template-columns: 36px repeat(10, 1fr);
            gap: 7px;
            justify-items: center;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            backdrop-filter: blur(8px);
        }

        .row-label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .seat {
            width: 50px;
            height: 46px;
            border-radius: 8px 8px 4px 4px;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.68rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            letter-spacing: 0.02em;
        }

        .seat.available {
            background: linear-gradient(145deg, var(--green-dark), var(--green-mid));
            border-color: rgba(0, 230, 118, 0.4);
            color: #a5d6a7;
            box-shadow: 0 2px 8px var(--green-glow);
        }

        .seat.available:hover {
            transform: translateY(-3px) scale(1.08);
            box-shadow: 0 6px 20px var(--green-glow);
            border-color: var(--green);
            color: #e8f5e9;
        }

        .seat.available:active {
            transform: translateY(-1px) scale(1.02);
        }

        .seat.booked {
            background: linear-gradient(145deg, var(--red-dark), var(--red-mid));
            border-color: rgba(255, 23, 68, 0.3);
            color: #ef9a9a;
            cursor: not-allowed;
            box-shadow: 0 2px 8px var(--red-glow);
            opacity: 0.85;
        }

        .seat.booking {
            background: linear-gradient(145deg, var(--orange-dark), var(--orange));
            border-color: rgba(255, 183, 77, 0.5);
            color: #fff3e0;
            cursor: wait;
            animation: pulse 0.7s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.65; transform: scale(0.96); }
        }

        /* ── Controls ── */
        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .btn {
            padding: 0.6rem 1.6rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text);
            cursor: pointer;
            font-family: var(--font);
            font-size: 0.82rem;
            font-weight: 500;
            transition: all 0.2s ease;
            letter-spacing: 0.01em;
        }

        .btn:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
            box-shadow: 0 0 16px var(--accent-glow);
            transform: translateY(-1px);
        }

        .btn:active { transform: translateY(0); }

        .btn.danger { border-color: rgba(255, 23, 68, 0.4); }
        .btn.danger:hover {
            border-color: var(--red);
            box-shadow: 0 0 16px var(--red-glow);
        }

        /* ── Toast ── */
        #toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 0.85rem 1.6rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 100;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
            opacity: 0;
            pointer-events: none;
            max-width: 420px;
            text-align: center;
            backdrop-filter: blur(12px);
            font-family: var(--font);
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        #toast.success {
            background: rgba(27, 94, 32, 0.9);
            border: 1px solid var(--green);
            color: #c8e6c9;
            box-shadow: 0 8px 32px var(--green-glow);
        }

        #toast.error {
            background: rgba(183, 28, 28, 0.9);
            border: 1px solid var(--red);
            color: #ffcdd2;
            box-shadow: 0 8px 32px var(--red-glow);
        }

        /* ── Footer ── */
        footer {
            padding: 1.2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.7rem;
            border-top: 1px solid var(--border);
            width: 100%;
            background: var(--bg-secondary);
        }

        footer .tech {
            letter-spacing: 0.05em;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            justify-content: center;
            margin-top: 0.5rem;
            font-size: 0.7rem;
        }

        .connection-status .indicator {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--green);
            animation: blink 2.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .seat {
                width: 36px;
                height: 34px;
                font-size: 0.58rem;
                border-radius: 6px 6px 3px 3px;
            }
            .seat-grid { gap: 4px; padding: 1rem; }
            header h1 { font-size: 1.4rem; }
            .stats-bar { gap: 1.5rem; }
            main { padding: 1.5rem 1rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🎫 Ticketing Engine</h1>
        <p class="subtitle">Intelligent High-Concurrency Seat Booking</p>
        <div class="stats-bar">
            <div class="stat">
                <span class="dot green"></span>
                Available: <strong id="availCount">50</strong>
            </div>
            <div class="stat">
                <span class="dot red"></span>
                Booked: <strong id="bookedCount">0</strong>
            </div>
        </div>
    </header>

    <main>
        <div class="stage">━━━ STAGE ━━━</div>

        <div class="user-input">
            <label for="username">Your Name:</label>
            <input type="text" id="username" placeholder="Enter your name" value="Guest">
        </div>

        <div id="seatGrid" class="seat-grid">
            <!-- Seats rendered by JS -->
        </div>

        <div class="controls">
            <button class="btn" id="refreshBtn" onclick="fetchSeats()">↻ Refresh</button>
            <button class="btn danger" id="resetBtn" onclick="resetSeats()">⟲ Reset All</button>
        </div>
    </main>

    <div id="toast"></div>

    <footer>
        <div class="tech">Powered by C++ · Crow · MySQL</div>
        <div class="connection-status">
            <span class="indicator" id="connIndicator"></span>
            <span id="connText">Auto-refreshing every 3s</span>
        </div>
    </footer>

    <script>
        const API_BASE = window.location.origin;
        const EVENT_ID = 1;
        let seats = [];
        let isBooking = false;

        // ── Toast notification ──
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'show ' + type;
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.className = ''; }, 3500);
        }

        // ── Fetch seat map from /seats (reads from MySQL) ──
        async function fetchSeats() {
            try {
                const res = await fetch(`${API_BASE}/seats?event_id=${EVENT_ID}`);
                if (res.status === 403) {
                    showToast('⚠ Rate limit hit. Slowing down...', 'error');
                    return;
                }
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                seats = await res.json();
                renderGrid();
                updateStats();
                setConnected(true);
            } catch (err) {
                console.error('Failed to fetch seats:', err);
                setConnected(false);
            }
        }

        // ── Connection status indicator ──
        function setConnected(connected) {
            const indicator = document.getElementById('connIndicator');
            const text = document.getElementById('connText');
            if (connected) {
                indicator.style.background = 'var(--green)';
                text.textContent = 'Auto-refreshing every 3s';
            } else {
                indicator.style.background = 'var(--red)';
                text.textContent = 'Connection lost — retrying...';
            }
        }

        // ── Render seat grid ──
        function renderGrid() {
            const grid = document.getElementById('seatGrid');
            grid.innerHTML = '';

            const rows = ['A', 'B', 'C', 'D', 'E'];

            rows.forEach((rowLetter) => {
                // Row label
                const label = document.createElement('div');
                label.className = 'row-label';
                label.textContent = rowLetter;
                grid.appendChild(label);

                // 10 seats per row
                for (let col = 1; col <= 10; col++) {
                    const seatLabel = rowLetter + col;
                    const seat = seats.find(s => s.seat_label === seatLabel);

                    const el = document.createElement('div');
                    el.className = 'seat ' + (seat && seat.is_booked ? 'booked' : 'available');
                    el.textContent = seatLabel;
                    el.id = 'seat-' + seatLabel;

                    if (seat && !seat.is_booked) {
                        el.addEventListener('click', () => bookSeat(seat.id, seatLabel));
                    }

                    if (seat && seat.is_booked && seat.booked_by) {
                        el.title = `Booked by: ${seat.booked_by}`;
                    }

                    grid.appendChild(el);
                }
            });
        }

        // ── Update stats ──
        function updateStats() {
            const booked = seats.filter(s => s.is_booked).length;
            const available = seats.length - booked;
            document.getElementById('availCount').textContent = available;
            document.getElementById('bookedCount').textContent = booked;
        }

        // ── Book a seat (POST /book with pessimistic locking on backend) ──
        async function bookSeat(seatId, seatLabel) {
            if (isBooking) return;

            const user = document.getElementById('username').value.trim();
            if (!user) {
                showToast('Please enter your name first.', 'error');
                document.getElementById('username').focus();
                return;
            }

            isBooking = true;

            // Optimistic UI — show booking state
            const el = document.getElementById('seat-' + seatLabel);
            if (el) {
                el.className = 'seat booking';
                el.textContent = '···';
            }

            try {
                const res = await fetch(`${API_BASE}/book`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        event_id: EVENT_ID,
                        seat_id: seatId,
                        user: user
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    showToast(`✓ Seat ${seatLabel} booked for ${user}!`, 'success');
                } else if (res.status === 409) {
                    showToast(`✗ Seat ${seatLabel} already taken!`, 'error');
                } else if (res.status === 403) {
                    showToast('⚠ Slow down! Bot detection triggered.', 'error');
                } else {
                    showToast(`✗ ${data.error || 'Booking failed'}`, 'error');
                }
            } catch (err) {
                showToast('✗ Network error. Is the server running?', 'error');
                console.error('Booking error:', err);
            } finally {
                isBooking = false;
                // Refresh seat map to get authoritative state
                setTimeout(fetchSeats, 200);
            }
        }

        // ── Reset all seats ──
        async function resetSeats() {
            if (!confirm('Reset all 50 seats to available?')) return;

            try {
                const res = await fetch(`${API_BASE}/reset`, { method: 'POST' });
                if (res.ok) {
                    showToast('All seats reset!', 'success');
                    fetchSeats();
                } else {
                    showToast('Reset failed.', 'error');
                }
            } catch (err) {
                showToast('Network error.', 'error');
            }
        }

        // ── Init + auto-refresh ──
        fetchSeats();
        setInterval(fetchSeats, 3000);
    </script>
</body>
</html>
